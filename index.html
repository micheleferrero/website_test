<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ti amo tanto, Giulia ♥</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23f27c9b' d='M12 21s-7.5-4.6-9.9-9.2C.6 8.6 2.4 4.5 6.3 4.1c2.2-.2 4 .9 5.7 3 1.7-2.1 3.5-3.2 5.7-3 3.9.4 5.7 4.5 4.2 7.7C19.5 16.4 12 21 12 21z'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Fredoka", system-ui, sans-serif;
      background: linear-gradient(180deg, #ffe4ec 0%, #fff3f0 55%, #fdf6e9 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }

    /* ---------- Title ---------- */
    h1 {
      font-family: "Pacifico", cursive;
      font-weight: 400;
      color: #e8567c;
      font-size: clamp(3rem, 12vw, 6rem);
      line-height: 1.1;
      text-align: center;
      text-shadow: 3px 3px 0 #fff, 6px 6px 0 rgba(232, 86, 124, .15);
      animation: wobble 3s ease-in-out infinite;
      position: relative; z-index: 3;
    }
    .name {
      font-family: "Pacifico", cursive;
      color: #b57edc;
      font-size: clamp(1.6rem, 6vw, 2.6rem);
      margin-top: .2rem;
      position: relative; z-index: 3;
    }
    @keyframes wobble {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2deg) scale(1.03); }
    }

    /* ---------- Bear stage ---------- */
    .stage {
      position: relative;
      width: min(300px, 70vw);
      aspect-ratio: 1;
      margin: 4.5rem 0 6rem;
      z-index: 3;
    }

    .bear {
      position: absolute; inset: 12%;
      cursor: pointer;
      background: none; border: none;
      animation: bounce 2.4s ease-in-out infinite;
    }
    .bear svg { width: 100%; height: 100%; overflow: visible; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .bear.shiver { animation: shiver .08s linear 14; }
    @keyframes shiver {
      0% { transform: translateX(-3px) rotate(-1deg); }
      50% { transform: translateX(3px) rotate(1deg); }
      100% { transform: translateX(-3px) rotate(-1deg); }
    }
    .eye { animation: blink 4s infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(.1); }
    }
    .held-heart { animation: beat 1.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      20% { transform: scale(1.15); }
      40% { transform: scale(1); }
      60% { transform: scale(1.1); }
    }

    /* Hearts going around the bear */
    .orbit {
      position: absolute; inset: 0;
      animation: spin 14s linear infinite;
      pointer-events: none;
    }
    .orbit span {
      position: absolute; left: 50%; top: 50%;
      font-size: 1.6rem;
      line-height: 1;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Speech bubble */
    .bubble {
      position: absolute;
      bottom: 88%; left: 50%;
      transform: translateX(-50%) scale(.6);
      opacity: 0;
      width: max-content; max-width: min(300px, 82vw);
      background: #fff;
      color: #8a4a5e;
      font-size: 1.15rem; font-weight: 500;
      text-align: center;
      padding: .8rem 1.1rem;
      border-radius: 20px;
      box-shadow: 0 8px 24px -10px rgba(232, 86, 124, .5);
      transition: opacity .3s ease, transform .4s cubic-bezier(.3, 1.6, .5, 1);
      pointer-events: none;
      z-index: 5;
    }
    .bubble::after {
      content: ""; position: absolute; top: 100%; left: 50%;
      transform: translateX(-50%);
      border: 10px solid transparent; border-top-color: #fff;
    }
    .bubble.show { opacity: 1; transform: translateX(-50%) scale(1); }

    .hint {
      position: absolute; bottom: -1.6rem; left: 50%;
      transform: translateX(-50%);
      font-size: .95rem; color: #b0607a;
      white-space: nowrap;
      animation: pulse 1.8s ease-in-out infinite;
      transition: opacity .3s;
    }
    @keyframes pulse { 50% { opacity: .4; } }

    /* ---------- Flowers ---------- */
    .meadow {
      position: fixed; left: 0; right: 0; bottom: 0;
      height: 160px;
      pointer-events: none;
      z-index: 2;
    }
    .flower {
      position: absolute; bottom: -6px;
      transform-origin: bottom center;
      animation: sway 4s ease-in-out infinite;
    }
    @keyframes sway {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(4deg); }
    }

    /* ---------- Floating hearts ---------- */
    .float-heart {
      position: fixed; bottom: -40px;
      pointer-events: none;
      z-index: 1;
      animation: rise linear forwards;
    }
    @keyframes rise {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      10% { opacity: .9; }
      100% { transform: translate(var(--drift), -110vh) rotate(var(--rot)); opacity: 0; }
    }

    .pop {
      position: fixed; pointer-events: none; z-index: 10;
      font-size: 1.4rem;
      animation: pop 1.1s ease-out forwards;
    }
    @keyframes pop {
      0% { transform: translate(-50%, -50%) scale(.3); opacity: 1; }
      100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>

  <h1>Ti amo tanto</h1>
  <p class="name">Giulia</p>

  <div class="stage">
    <div class="orbit" id="orbit"></div>

    <div class="bubble" id="bubble">Che freddo a Parigi, ti aspetto a casuccia 🥶🏠</div>

    <button class="bear" id="bear" aria-label="Orsetto">
      <svg viewBox="0 0 200 230" aria-hidden="true">
        <!-- ears -->
        <circle cx="52" cy="46" r="26" fill="#c99670"/>
        <circle cx="52" cy="46" r="14" fill="#f4d6bd"/>
        <circle cx="148" cy="46" r="26" fill="#c99670"/>
        <circle cx="148" cy="46" r="14" fill="#f4d6bd"/>
        <!-- feet -->
        <ellipse cx="62" cy="214" rx="22" ry="14" fill="#c99670"/>
        <ellipse cx="138" cy="214" rx="22" ry="14" fill="#c99670"/>
        <ellipse cx="62" cy="216" rx="12" ry="7" fill="#f4d6bd"/>
        <ellipse cx="138" cy="216" rx="12" ry="7" fill="#f4d6bd"/>
        <!-- body -->
        <ellipse cx="100" cy="172" rx="56" ry="48" fill="#d6a983"/>
        <ellipse cx="100" cy="180" rx="34" ry="30" fill="#f4d6bd"/>
        <!-- head -->
        <circle cx="100" cy="88" r="60" fill="#d6a983"/>
        <!-- scarf (it's cold in Paris!) -->
        <path d="M50 128 Q100 150 150 128 L152 142 Q100 164 48 142 Z" fill="#9fd3f2"/>
        <path d="M120 140 L132 182 L116 184 L110 146 Z" fill="#8cc7ea"/>
        <path d="M60 134 L64 140 M78 140 L80 147 M96 143 L97 150 M114 142 L113 149 M132 138 L130 145" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <!-- muzzle -->
        <ellipse cx="100" cy="106" rx="27" ry="21" fill="#f4d6bd"/>
        <!-- eyes -->
        <g class="eye"><circle cx="77" cy="80" r="7" fill="#3a2a22"/><circle cx="79.5" cy="77.5" r="2.4" fill="#fff"/></g>
        <g class="eye"><circle cx="123" cy="80" r="7" fill="#3a2a22"/><circle cx="125.5" cy="77.5" r="2.4" fill="#fff"/></g>
        <!-- cheeks -->
        <ellipse cx="62" cy="102" rx="10" ry="7" fill="#f7a1b5" opacity=".7"/>
        <ellipse cx="138" cy="102" rx="10" ry="7" fill="#f7a1b5" opacity=".7"/>
        <!-- nose + mouth -->
        <ellipse cx="100" cy="98" rx="9" ry="6.5" fill="#3a2a22"/>
        <path d="M100 104 V110 M90 110 Q95 117 100 110 Q105 117 110 110" stroke="#3a2a22" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <!-- arms -->
        <ellipse cx="62" cy="172" rx="16" ry="26" fill="#c99670" transform="rotate(35 62 172)"/>
        <ellipse cx="138" cy="172" rx="16" ry="26" fill="#c99670" transform="rotate(-35 138 172)"/>
        <!-- heart held in paws -->
        <path class="held-heart" d="M100 204s-30-18-36-36c-4-12 3-24 15-25 9-1 16 4 21 11 5-7 12-12 21-11 12 1 19 13 15 25-6 18-36 36-36 36z" fill="#f2557d"/>
        <path d="M78 160 q4-6 11-6" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>
      </svg>
    </button>

    <div class="hint" id="hint">tocca l'orsetto 🧸</div>
  </div>

  <div class="meadow" id="meadow" aria-hidden="true"></div>

  <script>
    const heartEmojis = ["💗", "💖", "💕", "💞", "❤️", "🩷"];
    const pick = (a) => a[Math.floor(Math.random() * a.length)];

    // Hearts going around the bear
    const orbit = document.getElementById("orbit");
    const count = 8;
    for (let i = 0; i < count; i++) {
      const s = document.createElement("span");
      s.textContent = heartEmojis[i % heartEmojis.length];
      const angle = (360 / count) * i;
      s.style.transform = `translate(-50%, -50%) rotate(${angle}deg) translateY(calc(-1 * min(150px, 35vw))) rotate(${-angle}deg)`;
      orbit.appendChild(s);
    }

    // Light-coloured flowers
    const colors = [
      ["#ffd1dc", "#ffb3c6"], // pink
      ["#e6d7ff", "#cdb4f5"], // lavender
      ["#fff2b3", "#ffe27a"], // butter yellow
      ["#ffdcc7", "#ffc4a3"], // peach
      ["#d4f1ff", "#b0e2fa"], // baby blue
      ["#ffffff", "#f5e6ee"]  // white
    ];
    function flowerSVG([petal, edge], size, stem) {
      const petals = [0, 72, 144, 216, 288].map(a =>
        `<ellipse cx="20" cy="9" rx="7.5" ry="10" fill="${petal}" stroke="${edge}" stroke-width="1.2" transform="rotate(${a} 20 20)"/>`
      ).join("");
      return `<svg width="${size}" height="${size + stem}" viewBox="0 0 40 ${40 + stem * 40 / size}">
        <path d="M20 22 Q${16 + Math.random() * 8} ${30 + stem * 20 / size} 20 ${40 + stem * 40 / size}" stroke="#9ccc8f" stroke-width="2.5" fill="none"/>
        <ellipse cx="13" cy="${32 + stem * 20 / size}" rx="6" ry="3" fill="#a8d89b" transform="rotate(-30 13 ${32 + stem * 20 / size})"/>
        ${petals}
        <circle cx="20" cy="20" r="5.5" fill="#ffd36e"/>
      </svg>`;
    }
    const meadow = document.getElementById("meadow");
    function plantFlowers() {
      meadow.innerHTML = "";
      const n = Math.round(window.innerWidth / 55) + 4;
      for (let i = 0; i < n; i++) {
        const f = document.createElement("div");
        f.className = "flower";
        const size = 30 + Math.random() * 26;
        const stem = 30 + Math.random() * 70;
        f.innerHTML = flowerSVG(pick(colors), size, stem);
        f.style.left = `${(i / n) * 100 + (Math.random() * 4 - 2)}%`;
        f.style.marginLeft = `${-size / 2}px`;
        f.style.animationDelay = `${-Math.random() * 4}s`;
        f.style.animationDuration = `${3 + Math.random() * 2.5}s`;
        meadow.appendChild(f);
      }
    }
    plantFlowers();
    window.addEventListener("resize", plantFlowers);

    // Hearts floating up the screen
    function floatHeart() {
      const h = document.createElement("div");
      h.className = "float-heart";
      h.textContent = pick(heartEmojis);
      h.style.left = `${Math.random() * 100}vw`;
      h.style.fontSize = `${14 + Math.random() * 22}px`;
      h.style.setProperty("--drift", `${(Math.random() - .5) * 120}px`);
      h.style.setProperty("--rot", `${(Math.random() - .5) * 90}deg`);
      const dur = 6 + Math.random() * 5;
      h.style.animationDuration = `${dur}s`;
      document.body.appendChild(h);
      setTimeout(() => h.remove(), dur * 1000);
    }
    setInterval(floatHeart, 450);
    for (let i = 0; i < 6; i++) setTimeout(floatHeart, i * 150);

    // Little heart burst
    function burst(x, y, n = 10) {
      for (let i = 0; i < n; i++) {
        const p = document.createElement("div");
        p.className = "pop";
        p.textContent = pick(heartEmojis);
        p.style.left = `${x}px`; p.style.top = `${y}px`;
        const a = Math.random() * Math.PI * 2, d = 50 + Math.random() * 80;
        p.style.setProperty("--dx", `${Math.cos(a) * d}px`);
        p.style.setProperty("--dy", `${Math.sin(a) * d}px`);
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1100);
      }
    }

    // Tap the bear
    const bear = document.getElementById("bear");
    const bubble = document.getElementById("bubble");
    const hint = document.getElementById("hint");
    let hideTimer;
    bear.addEventListener("click", (e) => {
      bubble.classList.add("show");
      hint.style.opacity = 0;
      bear.classList.remove("shiver"); void bear.offsetWidth; bear.classList.add("shiver");
      burst(e.clientX, e.clientY, 12);
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => bubble.classList.remove("show"), 5000);
    });
    bear.addEventListener("animationend", (e) => { if (e.animationName === "shiver") bear.classList.remove("shiver"); });

    document.addEventListener("click", (e) => {
      if (!e.target.closest("#bear")) burst(e.clientX, e.clientY, 6);
    });
  </script>
</body>
</html>
